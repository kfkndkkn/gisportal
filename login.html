<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WebGIS BAPETEN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen font-sans">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700 space-y-6">
        <div class="text-center space-y-2">
            <div class="inline-block p-3 bg-amber-500 text-slate-950 rounded-xl font-bold">
                <i class="fa-solid fa-atom text-2xl"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-800">Sistem Informasi WebGIS BAPETEN</h2>
            <p class="text-xs text-slate-500">Silakan login untuk mengakses portal peta</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Username</label>
                <input type="text" id="username" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" required placeholder="Ketik username...">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                <input type="password" id="password" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" required placeholder="••••••••">
            </div>

            <div id="error-msg" class="hidden text-xs text-red-600 bg-red-50 p-2 rounded border border-red-200"></div>

            <button type="submit" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold rounded-lg text-xs transition-colors shadow-lg">
                Masuk ke Geoportal
            </button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            errorMsg.classList.add('hidden');

            try {
                // Mengirim credential ke Backend Python lokal
                const response = await fetch('http://127.0.0.1:8000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Simpan Role dan Username ke localStorage Browser
                    localStorage.setItem('user_role', data.role);
                    localStorage.setItem('user_name', data.username);

                    // Redirect ke halaman peta utama
                    window.location.href = 'dummy_bimtek_index.html';
                } else {
                    errorMsg.innerText = data.detail || 'Login gagal';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.innerText = 'Gagal terhubung ke server backend Python!';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
